[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-stats"
version = "0.1.0"
description = "Auditable traffic counts from fixed-camera CCTV, offline on CPU"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "matplotlib>=3.7"]

[project.scripts]
traffic-stats = "traffic_stats.orchestrator:main"

[project.optional-dependencies]
yolo = ["ultralytics>=8.0"]
reports = ["reportlab>=4.0", "python-docx>=1.1", "pypdfium2>=4.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["traffic_stats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
